<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2100" viewBox="0 0 1500 2100">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <filter id="pill-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e3a8a" flood-opacity="0.2"/>
    </filter>
    
    <linearGradient id="start-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="end-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="core-card-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ================= PHASE CONTAINERS ================= -->
  
  <!-- Phase 1: Baseline Benchmarking & Model Selection (Steps 1-4) -->
  <g id="phase1">
    <rect x="120" y="130" width="1260" height="570" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.8"/>
    <rect x="145" y="148" width="320" height="28" rx="6" fill="#e2e8f0"/>
    <text x="305" y="167" font-family="'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="bold" fill="#475569" text-anchor="middle" letter-spacing="0.5">PHASE 1: BASELINE BENCHMARKING</text>
  </g>

  <!-- Phase 2: Core Architectural Innovation (Step 5) -->
  <g id="phase2">
    <rect x="120" y="730" width="1260" height="225" rx="16" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.8"/>
    <rect x="145" y="748" width="310" height="28" rx="6" fill="#dcfce7"/>
    <text x="300" y="767" font-family="'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle" letter-spacing="0.5">PHASE 2: ARCHITECTURAL DESIGN</text>
  </g>

  <!-- Phase 3: Progressive Training & Distillation (Steps 6-7) -->
  <g id="phase3">
    <rect x="120" y="985" width="1260" height="395" rx="16" fill="#fffbeb" stroke="#fef3c7" stroke-width="1.8"/>
    <rect x="145" y="1003" width="310" height="28" rx="6" fill="#fef3c7"/>
    <text x="300" y="1022" font-family="'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="bold" fill="#b45309" text-anchor="middle" letter-spacing="0.5">PHASE 3: TRAINING &amp; DISTILLATION</text>
  </g>

  <!-- Phase 4: Multi-Stage Evaluation & Deployment (Steps 8-9) -->
  <g id="phase4">
    <rect x="120" y="1410" width="1260" height="395" rx="16" fill="#faf5ff" stroke="#f3e8ff" stroke-width="1.8"/>
    <rect x="145" y="1428" width="310" height="28" rx="6" fill="#f3e8ff"/>
    <text x="300" y="1447" font-family="'DejaVu Sans', Arial, sans-serif" font-size="12" font-weight="bold" fill="#7e22ce" text-anchor="middle" letter-spacing="0.5">PHASE 4: EVALUATION &amp; DEPLOYMENT</text>
  </g>

  <!-- ================= FLOW NODES & ARROWS ================= -->

  <!-- START Terminal Node -->
  <rect x="635" y="42" width="230" height="58" rx="29" fill="url(#start-grad)" filter="url(#pill-shadow)"/>
  <text x="750" y="78" font-family="'DejaVu Sans', Arial, sans-serif" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">Start</text>

  <!-- Arrow: Start -> Step 1 -->
  <line x1="750" y1="100" x2="750" y2="190" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Step 1: Review literature -->
  <rect x="260" y="195" width="980" height="84" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6" filter="url(#card-shadow)"/>
  <text x="750" y="244" font-family="'DejaVu Sans', Arial, sans-serif" font-size="17" font-weight="600" fill="#1e293b" text-anchor="middle">Review literature on bump and pothole detection</text>

  <!-- Arrow: Step 1 -> Step 2 -->
  <line x1="750" y1="279" x2="750" y2="322" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Step 2: Train stock baselines -->
  <rect x="260" y="327" width="980" height="84" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6" filter="url(#card-shadow)"/>
  <text x="750" y="376" font-family="'DejaVu Sans', Arial, sans-serif" font-size="17" font-weight="600" fill="#1e293b" text-anchor="middle">Train seven stock baselines on public dataset (fixed protocol)</text>

  <!-- Arrow: Step 2 -> Step 3 -->
  <line x1="750" y1="411" x2="750" y2="454" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Step 3: Evaluate baselines -->
  <rect x="260" y="459" width="980" height="84" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6" filter="url(#card-shadow)"/>
  <text x="750" y="508" font-family="'DejaVu Sans', Arial, sans-serif" font-size="17" font-weight="600" fill="#1e293b" text-anchor="middle">Evaluate baselines on held-out test split</text>

  <!-- Arrow: Step 3 -> Step 4 -->
  <line x1="750" y1="543" x2="750" y2="586" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Step 4: Select YOLO26n -->
  <rect x="260" y="591" width="980" height="84" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8" filter="url(#card-shadow)"/>
  <text x="750" y="630" font-family="'DejaVu Sans', Arial, sans-serif" font-size="17" font-weight="600" fill="#1e293b" text-anchor="middle">Select YOLO26n as base</text>
  <text x="750" y="654" font-family="'DejaVu Sans', Arial, sans-serif" font-size="14.5" font-weight="500" fill="#64748b" text-anchor="middle">(most accurate, lowest cost)</text>

  <!-- Arrow: Step 4 -> Step 5 -->
  <line x1="750" y1="675" x2="750" y2="787" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-emerald)"/>

  <!-- Step 5: Design GV-YOLO26 (Highlighted Core Contribution) -->
  <rect x="230" y="792" width="1040" height="135" rx="14" fill="url(#core-card-grad)" stroke="#059669" stroke-width="2.2" filter="url(#card-shadow)"/>
  <rect x="660" y="806" width="180" height="22" rx="5" fill="#10b981"/>
  <text x="750" y="821" font-family="'DejaVu Sans', Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">PROPOSED ARCHITECTURE</text>
  <text x="750" y="860" font-family="'DejaVu Sans', Arial, sans-serif" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="middle">Design GV-YOLO26: GhostConv, VoVGSCSPC, P2 level, LGDH</text>
  <text x="750" y="894" font-family="'DejaVu Sans', Arial, sans-serif" font-size="15" font-weight="600" fill="#047857" text-anchor="middle">160×160 High-Resolution Grid  •  Grouped Convolutions (c/8)  •  NMS-Free End-to-End Head</text>

  <!-- Arrow: Step 5 -> Step 6 -->
  <line x1="750" y1="927" x2="750" y2="1042" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Step 6: Train each design stage -->
  <rect x="260" y="1047" width="980" height="95" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6" filter="url(#card-shadow)"/>
  <text x="750" y="1089" font-family="'DejaVu Sans', Arial, sans-serif" font-size="17" font-weight="600" fill="#1e293b" text-anchor="middle">Train each design stage with NWD loss and augmentation</text>
  <text x="750" y="1115" font-family="'DejaVu Sans', Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#64748b" text-anchor="middle">(6-stage progressive ablation ladder + weather simulation pipeline)</text>

  <!-- Arrow: Step 6 -> Step 7 -->
  <line x1="750" y1="1142" x2="750" y2="1192" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Step 7: Distil from teacher -->
  <rect x="260" y="1197" width="980" height="95" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6" filter="url(#card-shadow)"/>
  <text x="750" y="1239" font-family="'DejaVu Sans', Arial, sans-serif" font-size="17" font-weight="600" fill="#1e293b" text-anchor="middle">Distil from GV-YOLO26-S teacher (BCKD + CWD)</text>
  <text x="750" y="1265" font-family="'DejaVu Sans', Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#64748b" text-anchor="middle">(Feature imitation and response distillation analysis)</text>

  <!-- Arrow: Step 7 -> Step 8 -->
  <line x1="750" y1="1292" x2="750" y2="1467" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Step 8: Evaluate ablation stages -->
  <rect x="260" y="1472" width="980" height="95" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6" filter="url(#card-shadow)"/>
  <text x="750" y="1514" font-family="'DejaVu Sans', Arial, sans-serif" font-size="17" font-weight="600" fill="#1e293b" text-anchor="middle">Evaluate ablation stages and compare with baselines</text>
  <text x="750" y="1540" font-family="'DejaVu Sans', Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#64748b" text-anchor="middle">(Evaluated on leakage-free held-out split &amp; baseline comparisons)</text>

  <!-- Arrow: Step 8 -> Step 9 -->
  <line x1="750" y1="1567" x2="750" y2="1617" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Step 9: Export to TensorRT -->
  <rect x="260" y="1622" width="980" height="95" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.6" filter="url(#card-shadow)"/>
  <text x="750" y="1664" font-family="'DejaVu Sans', Arial, sans-serif" font-size="17" font-weight="600" fill="#1e293b" text-anchor="middle">Export to TensorRT and run on road images and video</text>
  <text x="750" y="1690" font-family="'DejaVu Sans', Arial, sans-serif" font-size="14.5" font-weight="normal" fill="#64748b" text-anchor="middle">(FP16/INT8 Jetson deployment &amp; ByteTrack temporal hazard confirmation)</text>

  <!-- Arrow: Step 9 -> End -->
  <line x1="750" y1="1717" x2="750" y2="1875" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- END Terminal Node -->
  <rect x="635" y="1880" width="230" height="58" rx="29" fill="url(#end-grad)" filter="url(#pill-shadow)"/>
  <text x="750" y="1916" font-family="'DejaVu Sans', Arial, sans-serif" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">End</text>

</svg>
